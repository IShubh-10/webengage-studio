<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png"
        href="https://afiles.webengage.com/76aba26/8dd7acac-b831-43c8-b1c1-e71673271986.avif" />
    <title>Dynamic Images · Webengage Creative Studio</title>
    <script src="assets/origin.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/shell.css" />
    <script>
        // The nav bar's Dynamic Images sections are views inside this page, so it
        // hands them back here instead of navigating.
        window.STUDIO_SHELL = {
            active: 'studio',
            section: new URLSearchParams(window.location.search).get('view') === 'templates'
                ? 'templates'
                : 'studio',
            onSection: (key) => switchTab(key),
        };
    </script>
    <style>
        /* Layout ---------------------------------------------------------- */
        .view-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .page-view {
            display: none;
            height: 100%;
            width: 100%;
        }

        .page-view.active {
            display: flex;
            overflow-y: auto;
        }

        .studio-layout {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 16px;
            padding: 16px;
            height: 100%;
            width: 100%;
        }

        /* Panels ---------------------------------------------------------- */
        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-card);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--panel-alt);
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .panel-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        /* Forms ----------------------------------------------------------- */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group.inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .form-group.inline label {
            margin-bottom: 0;
        }

        textarea {
            min-height: 38px;
            line-height: 1.5;
            resize: vertical;
        }

        .btn-group-row {
            display: flex;
            gap: 8px;
        }

        /* Buttons: the studio's own buttons fill their column ------------- */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--success);
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        button:hover {
            background: var(--success-hover);
        }

        button.secondary {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: #334155;
        }

        button.secondary:hover {
            background: var(--panel-alt);
            border-color: var(--border-strong);
            color: #334155;
        }

        button.primary {
            background: var(--primary);
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        button.success {
            background: var(--success);
        }

        button.success:hover {
            background: var(--success-hover);
        }

        /* Viewing someone else's template ---------------------------------
           Every control is genuinely disabled by setReadOnly(); this only says
           so visibly, so the workspace does not look broken. */
        .read-only-banner {
            margin-bottom: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--primary);
            border-radius: var(--radius-sm);
            background: var(--panel-alt);
            font-size: 12px;
            line-height: 1.55;
            color: var(--text-muted);
        }

        .read-only .text-element,
        .read-only .image-element {
            cursor: default;
        }

        .read-only .text-element:hover,
        .read-only .image-element:hover {
            border-color: transparent;
        }

        /* Canvas ---------------------------------------------------------- */
        .canvas-panel {
            display: flex;
            flex-direction: column;
            /* overflow: hidden; */
            /* background: #cbd5e1; */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: linear-gradient(45deg, #eef2f6 25%, transparent 25%) -8px 0 / 16px 16px, linear-gradient(-45deg, #eef2f6 25%, transparent 25%) -8px 0 / 16px 16px, linear-gradient(45deg, transparent 75%, #eef2f6 75%) 0 0 / 16px 16px, linear-gradient(-45deg, transparent 75%, #eef2f6 75%) 0 0 / 16px 16px, #f8fafc;
        }

        .canvas-viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .canvas-inner {
            position: relative;
            display: inline-block;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .canvas-inner.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 500px;
            height: 300px;
            border-radius: 8px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 14px;
        }

        /* Canvas elements and resize handles ------------------------------ */
        .text-element,
        .image-element {
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            border: 1px dashed transparent;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
            /* Without this a touch-drag scrolls the canvas instead of moving
               the layer: the browser claims the gesture before pointermove
               ever fires. */
            touch-action: none;
            /* The renderer rotates an image about its centre, so the preview
               has to agree or the two drift apart as the angle grows. */
            transform-origin: 50% 50%;
        }

        /*
         * A text layer is one line, always.
         *
         * The renderer draws it as a single SVG <text>, which has no line
         * breaking at all — so any wrap the preview shows is a layout the
         * render can never produce. And the preview does wrap without this:
         * an absolutely positioned box with `width: auto` shrink-to-fits
         * against the space left between it and the right-hand edge of the
         * canvas, so dragging a layer rightwards squeezes it until
         * "Hello, {{name}}" folds onto two lines.
         *
         * It never showed before because the drag clamp stopped a layer at
         * `canvas - its own width`, which left exactly enough room by
         * construction. A turned layer is allowed past that point, so the
         * squeeze became reachable.
         *
         * Keeping the line intact also keeps offsetWidth constant while the
         * layer is dragged, which the drag bounds depend on.
         */
        .text-element {
            white-space: nowrap;
        }

        .text-element:hover,
        .image-element:hover {
            border-color: var(--primary);
        }

        .image-element.selected,
        .text-element.selected {
            border: 1px solid var(--primary);
        }

        .image-element img {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .resize-handle {
            position: absolute;
            /* Inherited in effect from the layer, which is already
               touch-action: none — stated here as well so a handle keeps
               working if it is ever moved out of that subtree. */
            touch-action: none;
            width: 8px;
            height: 8px;
            display: none;
            background: #ffffff;
            border: 1.5px solid var(--primary);
            border-radius: 2px;
        }

        .selected .resize-handle {
            display: block;
        }

        .resize-handle.tl {
            top: -5px;
            left: -5px;
            cursor: nwse-resize;
        }

        .resize-handle.tr {
            top: -5px;
            right: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.bl {
            bottom: -5px;
            left: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.br {
            bottom: -5px;
            right: -5px;
            cursor: nwse-resize;
        }

        /* Mid-edge handles resize a single axis, so an overlay can be stretched
           to match a background of any aspect ratio. */
        .resize-handle.t,
        .resize-handle.b {
            left: 50%;
            margin-left: -4px;
            cursor: ns-resize;
        }

        .resize-handle.t {
            top: -5px;
        }

        .resize-handle.b {
            bottom: -5px;
        }

        .resize-handle.l,
        .resize-handle.r {
            top: 50%;
            margin-top: -4px;
            cursor: ew-resize;
        }

        .resize-handle.l {
            left: -5px;
        }

        .resize-handle.r {
            right: -5px;
        }

        /* Rotation grip: held off the top edge on a stalk, the way every
           design tool puts it, so it never sits under the corner handles. */
        .rotate-handle {
            position: absolute;
            top: -36px;
            left: 50%;
            width: 22px;
            height: 22px;
            margin-left: -11px;
            display: none;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #ffffff;
            border: 1.5px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            cursor: grab;
            touch-action: none;
        }

        .rotate-handle:active {
            cursor: grabbing;
        }

        /* The icon must never be the event target: the drag starts on
           `e.target.classList.contains('rotate-handle')`, and an SVG child
           would make that test fail wherever the glyph itself is under the
           pointer. */
        .rotate-handle .icon {
            width: 13px;
            height: 13px;
            pointer-events: none;
        }

        .rotate-handle::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            width: 1.5px;
            height: 14px;
            margin-left: -0.75px;
            background: var(--primary);
        }

        .selected .rotate-handle {
            display: flex;
        }

        .read-only .rotate-handle {
            display: none;
        }

        /* Fingertips need roughly 24px of target. The handles keep their drawn
           size and gain an invisible margin around them, so the canvas looks
           identical on a desktop but is actually usable on a phone. */
        @media (pointer: coarse) {

            .resize-handle::after,
            .rotate-handle::after {
                content: '';
                position: absolute;
                top: -10px;
                right: -10px;
                bottom: -10px;
                left: -10px;
            }

            .rotate-handle {
                top: -42px;
            }
        }

        /* Layers list ----------------------------------------------------- */
        .layers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .layer-card {
            overflow: hidden;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .layer-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-card);
        }

        .layer-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(1, 84, 165, 0.12);
        }

        .layer-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 72px;
            padding: 8px;
            overflow: hidden;
            background: var(--panel-alt);
            background-image: url('https://afiles.webengage.com/76aba26/a60b8c8b-9d03-4e2f-a2f9-d5b39d12d595.jpg');
            background-size: cover;
        }

        .layer-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .layer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-delete-layer {
            width: auto;
            padding: 4px 9px;
            background: transparent;
            color: var(--danger-border);
            font-size: 11px;
        }

        .btn-delete-layer:hover {
            background: var(--danger-wash);
            color: var(--danger);
        }

        /* Templates library ---------------------------------------------- */
        .library-layout {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .library-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .library-header h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .library-header button {
            width: auto;
        }

        /* The blanket rule above fills a column; the shared primitives from
           theme.css are sized by their own content. */
        .folder-bar .btn {
            width: auto;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px;
        }

        .template-card {
            overflow: hidden;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), border-color 0.18s var(--ease);
        }

        .template-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 20px -6px rgba(1, 84, 165, 0.28);
        }

        .template-card-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 155px;
            padding: 12px;
            overflow: hidden;
            background: var(--panel-alt);
            border-bottom: 1px solid var(--border-color);
        }

        .template-card-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .template-card-body {
            padding: 14px 16px 16px;
        }

        .template-card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .template-card-meta {
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .template-card-actions {
            display: flex;
            /* flex-wrap: wrap; */
            gap: 8px;
        }

        .template-card-body button {
            padding: 7px 11px;
            font-size: 12px;
        }

        button.danger {
            background: #ffffff;
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }

        button.danger:hover {
            background: var(--danger-wash);
            border-color: #f87171;
            color: var(--danger);
        }

        /* Alerts and generated URL --------------------------------------- */
        .alert {
            margin-bottom: 14px;
            padding: 10px 13px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.5;
        }

        .alert.info {
            background: var(--primary-wash);
            border-color: #bfdbfe;
            color: #1e40af;
        }

        .alert.success {
            background: var(--ok-wash);
            border-color: var(--ok-border);
            color: var(--ok);
        }

        .alert.error {
            background: var(--danger-wash);
            border-color: var(--danger-border);
            color: var(--danger);
        }

        .code-output {
            padding: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .code-output code {
            display: block;
            margin: 6px 0 10px;
            font-family: 'SF Mono', ui-monospace, Menlo, monospace;
            font-size: 11px;
            line-height: 1.6;
            word-break: break-all;
            color: var(--text-main);
        }

        .code-output button {
            padding: 7px 11px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="app-shell">

        <!-- Nav bar: logo and profile only — navigation lives in the profile menu -->
        <header class="topnav">
            <a class="brand" href="tools.html">
                <h1>Webengage<span>Studio</span></h1>
            </a>
            <div class="nav-right">
                <div id="shellUser"></div>
            </div>
        </header>

        <div class="app-content fixed">

            <!-- Views Container -->
            <div class="view-container">

        <!-- PAGE 1: STUDIO VIEW -->
        <div class="page-view active" id="pageStudio">
            <div class="studio-layout">

                <!-- Left Column: Template Config & Element Add -->
                <div class="panel">
                    <div class="panel-header">Template Configuration</div>
                    <div class="panel-body">
                        <div id="alert" class="alert info" style="display: none"></div>
                        <div id="readOnlyBanner" class="read-only-banner" style="display: none"></div>

                        <div class="form-group">
                            <label for="templateId">Template ID</label>
                            <input type="text" id="templateId" disabled placeholder="Generating..." />
                        </div>

                        <div class="form-group">
                            <label for="bgUrl">Background Image URL <span style="color: red;">*</span></label>
                            <textarea id="bgUrl" placeholder="https://example.com/bg.jpg" rows="2" required></textarea>
                        </div>

                        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color);" />

                        <div class="form-group">
                            <label for="elementType">Element Type</label>
                            <select id="elementType">
                                <option value="text">Text Layer</option>
                                <option value="image">Image Overlay</option>
                            </select>
                        </div>

                        <div class="form-group" id="textContentGroup">
                            <label for="textContent">Text Content</label>
                            <textarea id="textContent" placeholder='e.g., "Hello, {{firstName}}!"' rows="2"></textarea>
                        </div>

                        <div class="form-group" id="imageSrcGroup" style="display: none;">
                            <label for="imageSrc">Image URL</label>
                            <textarea id="imageSrc" placeholder='"https://..." or "{{avatarUrl}}"' rows="2"></textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div class="form-group">
                                <label for="textX">Position X</label>
                                <input type="number" id="textX" value="20" />
                            </div>
                            <div class="form-group">
                                <label for="textY">Position Y</label>
                                <input type="number" id="textY" value="20" />
                            </div>
                        </div>


                        <div id="textOnlyFields">
                            <div class="form-group">
                                <label for="fontSize">Font Size (px)</label>
                                <input type="number" id="fontSize" value="24" min="8" max="120" />
                            </div>
                            <div class="form-group">
                                <label for="fontWeight">Font Weight</label>
                                <select id="fontWeight">
                                    <option value="normal">Normal</option>
                                    <option value="bold">Bold</option>
                                    <option value="600">Semi-bold</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="fontFamily">Font Family</label>
                                <select id="fontFamily">
                                    <option value="Arial" style="font-family: Arial, sans-serif;">Arial</option>
                                    <option value="Helvetica" style="font-family: Helvetica, sans-serif;">Helvetica
                                    </option>
                                    <option value="Verdana" style="font-family: Verdana, sans-serif;">Verdana</option>
                                    <option value="Tahoma" style="font-family: Tahoma, sans-serif;">Tahoma</option>
                                    <option value="Trebuchet MS" style="font-family: 'Trebuchet MS', sans-serif;">
                                        Trebuchet MS</option>
                                    <option value="Gill Sans" style="font-family: 'Gill Sans', sans-serif;">Gill Sans
                                    </option>
                                    <option value="Segoe UI" style="font-family: 'Segoe UI', sans-serif;">Segoe UI
                                    </option>
                                    <option value="Calibri" style="font-family: Calibri, sans-serif;">Calibri</option>
                                    <option value="Candara" style="font-family: Candara, sans-serif;">Candara</option>

                                    <option value="Times New Roman" style="font-family: 'Times New Roman', serif;">Times
                                        New Roman</option>
                                    <option value="Georgia" style="font-family: Georgia, serif;">Georgia</option>
                                    <option value="Garamond" style="font-family: Garamond, serif;">Garamond</option>
                                    <option value="Palatino Linotype" style="font-family: 'Palatino Linotype', serif;">
                                        Palatino Linotype</option>
                                    <option value="Book Antiqua" style="font-family: 'Book Antiqua', serif;">Book
                                        Antiqua</option>

                                    <option value="Courier New" style="font-family: 'Courier New', monospace;">Courier
                                        New</option>
                                    <option value="Lucida Console" style="font-family: 'Lucida Console', monospace;">
                                        Lucida Console</option>
                                    <option value="Monaco" style="font-family: Monaco, monospace;">Monaco</option>

                                    <option value="Impact" style="font-family: Impact, sans-serif;">Impact</option>
                                    <option value="Comic Sans MS" style="font-family: 'Comic Sans MS', cursive;">Comic
                                        Sans MS</option>
                                    <option value="Lucida Sans Unicode"
                                        style="font-family: 'Lucida Sans Unicode', sans-serif;">Lucida Sans Unicode
                                    </option>
                                    <option value="Century Gothic" style="font-family: 'Century Gothic', sans-serif;">
                                        Century Gothic</option>
                                    <option value="Franklin Gothic Medium"
                                        style="font-family: 'Franklin Gothic Medium', sans-serif;">Franklin Gothic
                                        Medium</option>
                                    <option value="Arial Black" style="font-family: 'Arial Black', sans-serif;">Arial
                                        Black</option>
                                </select>
                            </div>
                            <div class="form-group inline">
                                <label for="textColor">Text Color</label>
                                <input type="color" id="textColor" value="#000000" />
                            </div>

                            <div class="form-group">
                                <label for="borderStyle">Text Border</label>
                                <select id="borderStyle">
                                    <option value="none">None</option>
                                    <option value="solid">Solid</option>
                                    <option value="dashed">Dashed</option>
                                    <option value="dotted">Dotted</option>
                                    <option value="double">Double</option>
                                </select>
                            </div>

                            <div id="borderDetailFields" style="display: none;">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                    <div class="form-group">
                                        <label for="borderWidth">Thickness (px)</label>
                                        <input type="number" id="borderWidth" value="1" min="1" max="40" />
                                    </div>
                                    <div class="form-group">
                                        <label for="borderRadius">Corner radius</label>
                                        <input type="number" id="borderRadius" value="10" min="0" max="200" />
                                    </div>
                                </div>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                    <div class="form-group">
                                        <label for="textPaddingX">Padding X (px)</label>
                                        <input type="number" id="textPaddingX" value="8" min="0" max="200" />
                                    </div>
                                    <div class="form-group">
                                        <label for="textPaddingY">Padding Y (px)</label>
                                        <input type="number" id="textPaddingY" value="8" min="0" max="200" />
                                    </div>
                                </div>
                                <div class="form-group inline">
                                    <label for="borderColor">Border Color</label>
                                    <input type="color" id="borderColor" value="#000000" />
                                </div>
                            </div>
                        </div>

                        <div id="imageOnlyFields" style="display: none;">
                            <div class="form-group">
                                <label for="imageWidth">Width (px / auto)</label>
                                <input type="text" id="imageWidth" value="100" />
                            </div>
                            <div class="form-group">
                                <label for="imageHeight">Height (px / auto)</label>

        <!-- PAGE 2: TEMPLATES LIBRARY VIEW -->

            </div>

    <script src="assets/shell.js"></script>

    <script>
        const state = {
            templateId: '',
            backgroundUrl: '',
            textElements: [],
            selectedElementIndex: -1,
            // Set when the open template belongs to someone else: the whole
            // workspace goes read-only. See setReadOnly().
